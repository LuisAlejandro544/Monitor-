name: APK Debug

# Flujo manual de GitHub Actions para compilar el APK Debug universal (32 y 64 bits).
# Se ejecuta únicamente de forma manual (workflow_dispatch), sin activarse por commits ni pull requests.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Debug (32 y 64 bits)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK Debug como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MemScope-APK-Debug
          path: app/build/outputs/apk/debug/*.apk
